# Config de build pour Railway (Nixpacks) — le repo a deux package.json
# séparés (racine = frontend Vite/React, server/ = backend Express), donc la
# détection automatique ne suffit pas : il faut installer les deux et ne
# builder que le frontend (le backend n'a rien à compiler, node exécute
# index.mjs directement).
[phases.install]
cmds = ["npm ci", "cd server && npm ci"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server/index.mjs"

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111521" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <!-- Ces trois balises sont ce qui fait qu'une fois ajoutée à l'écran
         d'accueil sur iPhone, l'app s'ouvre plein écran sans barre Safari,
         avec une barre de statut qui se fond dans l'en-tête bleu plutôt
         qu'une bande blanche disjointe — sans elles iOS ignore parfois le
         "display: standalone" du manifest et garde le chrome du navigateur. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Intervia" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Intervia</title>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
